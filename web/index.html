<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <title>QR Plate House Check</title>
  <link rel="stylesheet" href="/static/styles.css?v=203">
</head>
<body>
  <main class="shell">
    <header>
      <div class="logo" aria-hidden="true">QR</div>
      <div>
        <p class="eyebrow">HOUSE QR PLATE CHECK</p>
        <h1>QR Plate Match &amp; Inspect</h1>
        <p class="muted">Houses and photos are fetched from the house details API and checked automatically.</p>
      </div>
    </header>

    <form id="fetch-form" class="toolbar">
      <label class="date-label ulb-label">ULB<select id="ulb" required><option value="">Loading ULBs…</option></select></label>
      <label class="date-label">From date<input id="from-day" type="date" required></label>
      <label class="date-label">To date<input id="to-day" type="date" required></label>
      <button id="submit" class="button primary" type="submit">Fetch &amp; check</button>
      <button id="stop" class="button secondary hidden" type="button">Stop</button>
      <div id="timer" class="timer hidden" aria-live="polite">
        <span class="timer-main">Time: <b id="elapsed">0.0 s</b></span>
        <span id="batch-times" class="batch-times"></span>
      </div>
    </form>

    <div id="summary" class="summary hidden" aria-live="polite">
      <span class="chip total"><b id="n-done">0</b> / <b id="n-total">0</b> checked</span>
      <span class="chip approved"><b id="n-accepted">0</b> Accepted</span>
      <span class="chip rejected"><b id="n-rejected">0</b> Rejected</span>
      <span class="chip manual"><b id="n-manual">0</b> Manual review</span>
      <span class="chip failed"><b id="n-error">0</b> Error</span>
    </div>
    <p id="progress" class="muted"></p>

    <div class="filters hidden" id="filters" role="group" aria-label="Show">
      <button type="button" class="filter active" data-filter="all">All</button>
      <button type="button" class="filter" data-filter="Accepted">Accepted</button>
      <button type="button" class="filter" data-filter="Rejected">Rejected</button>
      <button type="button" class="filter" data-filter="Manual review">Manual review</button>
      <button type="button" class="filter" data-filter="Error">Error</button>
    </div>

    <div id="results" class="house-list"></div>
    <footer>Results are shown here only; nothing is written back to the house API.</footer>
  </main>

  <template id="house-template">
    <article class="house-card">
      <div class="thumbs">
        <figure><img class="qr-thumb" alt="Reference QR plate"><figcaption>QR plate</figcaption></figure>
        <figure><img class="house-thumb" alt="Property"><figcaption>Property</figcaption></figure>
      </div>
      <div class="house-info">
        <div class="house-top">
          <span><strong class="house-id"></strong> <span class="house-no"></span></span>
          <span class="badge"></span>
        </div>
        <p class="meta"></p>
        <p class="remark"></p>
      </div>
    </article>
  </template>
  <script src="/static/app.js?v=203" defer></script>
</body>
</html>
